name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Apply database schema and seed
        run: |
          psql "$DATABASE_URL" -c "create role app_service login;"
          for f in db/001_schema.sql db/002_seed.sql db/003_real_platform.sql db/004_seed_real.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Boot services
        run: |
          for s in gateway billing-service payments-service metering-service comms-service compliance-service; do
            (cd services/$s && node dist/index.js > /tmp/$s.log 2>&1 &)
          done
          for port in 4000 4001 4002 4003 4004 4005; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/health" > /dev/null && break
              [ "$i" = 30 ] && { echo "service on :$port failed to start"; cat /tmp/*.log; exit 1; }
              sleep 1
            done
          done

      - name: Integration tests
        run: node --test tests/

      - name: Show service logs on failure
        if: failure()
        run: tail -n 50 /tmp/*.log || true
